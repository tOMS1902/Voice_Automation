name: Render videos

# Push a new or changed episode (episodes/<product>/<name>.yaml) and this renders it.
# The finished videos are under the run's "videos" artifact. Or run it by hand from the Actions tab.
on:
  push:
    paths: ["episodes/**.yaml"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode file, e.g. episodes/ball-knowledge/rapid-fire-01.yaml"
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      # voiced lines are cached, so a timing tweak re-renders without spending credits
      - uses: actions/cache@v4
        with:
          path: out/voice-cache
          key: voice-${{ github.run_id }}
          restore-keys: voice-
      - name: Render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            files="${{ github.event.inputs.episode }}"
          else
            files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'episodes/*.yaml' 'episodes/**/*.yaml' || true)
          fi
          for f in $files; do echo "::group::$f"; node studio.mjs render "$f"; echo "::endgroup::"; done
          mkdir -p videos
          for d in out/*/*/; do [ -f "$d/video.mp4" ] && n=$(basename "$d") && cp "$d/video.mp4" "videos/$n.mp4" && cp "$d/silent.mp4" "videos/$n-silent.mp4" && { [ -f "$d/caption.txt" ] && cp "$d/caption.txt" "videos/$n-caption.txt" || true; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: videos/
          if-no-files-found: warn

      - name: Publish release assets
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="render-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Only upload voiced videos (skip -silent variants)
          voiced_files=$(ls videos/*.mp4 2>/dev/null | grep -v '\-silent\.mp4$' || true)
          if [ -z "$voiced_files" ]; then
            echo "No voiced videos to release"
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$tag" $voiced_files \
            --title "Videos $tag" \
            --notes "Auto-rendered from episode YAML push." \
            --latest=false
          echo "has_release=true" >> "$GITHUB_OUTPUT"

      - name: Queue to Buffer (TikTok)
        if: steps.release.outputs.has_release == 'true'
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          if [ -z "$BUFFER_TOKEN" ]; then
            echo "BUFFER_TOKEN not set — skipping"
            exit 0
          fi
          tag="${{ steps.release.outputs.tag }}"
          for mp4 in videos/*.mp4; do
            echo "$mp4" | grep -q '\-silent\.mp4$' && continue
            name=$(basename "$mp4" .mp4)
            video_url="https://github.com/${{ github.repository }}/releases/download/${tag}/${name}.mp4"
            caption_file="videos/${name}-caption.txt"
            if [ -f "$caption_file" ]; then
              caption=$(cat "$caption_file")
            else
              caption="$name"
            fi
            echo "Queuing $name to Buffer..."
            query=$(jq -n --arg text "$caption" --arg ch "$BUFFER_CHANNEL_ID" --arg url "$video_url" \
              '{query: "mutation CreatePost($input: CreatePostInput!) { createPost(input: $input) { ... on PostActionSuccess { post { id } } ... on MutationError { message } } }", variables: {input: {text: $text, channelId: $ch, schedulingType: "automatic", mode: "addToQueue", assets: [{video: {url: $url, metadata: {thumbnailOffset: 2000}}}]}}}')
            response=$(curl -sf -X POST "https://api.buffer.com" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $BUFFER_TOKEN" \
              -d "$query")
            echo "$response" | jq .
            echo " done."
          done
