name: Render videos

# Push a new or changed episode (episodes/<product>/<name>.yaml) and this renders it.
# The finished videos are under the run's "videos" artifact. Or run it by hand from the Actions tab.
on:
  push:
    paths: ["episodes/**.yaml"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode file, e.g. episodes/ball-knowledge/rapid-fire-01.yaml"
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      # voiced lines are cached, so a timing tweak re-renders without spending credits
      - uses: actions/cache@v4
        with:
          path: out/voice-cache
          key: voice-${{ github.run_id }}
          restore-keys: voice-
      - name: Render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            files="${{ github.event.inputs.episode }}"
          else
            files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'episodes/*.yaml' 'episodes/**/*.yaml' || true)
          fi
          for f in $files; do echo "::group::$f"; node studio.mjs render "$f"; echo "::endgroup::"; done
          mkdir -p videos
          for d in out/*/*/; do
            n=$(basename "$d")
            if [ -f "$d/video.mp4" ]; then
              cp "$d/video.mp4" "videos/$n.mp4" && cp "$d/silent.mp4" "videos/$n-silent.mp4"
            fi
            if ls "$d"/slide-*.png 1>/dev/null 2>&1; then
              mkdir -p "videos/$n-slides"
              for s in "$d"/slide-*.png; do
                sname=$(basename "$s")
                cp "$s" "videos/$n-slides/$sname"
                cp "$s" "videos/$n-$sname"
              done
            fi
            [ -f "$d/caption.txt" ] && cp "$d/caption.txt" "videos/$n-caption.txt" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: videos/
          if-no-files-found: warn

      - name: Publish release assets
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="render-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Collect voiced videos (skip -silent variants) and carousel slides (flat)
          voiced_files=$(ls videos/*.mp4 2>/dev/null | grep -v '\-silent\.mp4$' || true)
          slide_files=$(ls videos/*-slide-*.png 2>/dev/null || true)
          all_files="$voiced_files $slide_files"
          all_files=$(echo "$all_files" | xargs)
          if [ -z "$all_files" ]; then
            echo "No videos or carousels to release"
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$tag" $all_files \
            --title "Videos $tag" \
            --notes "Auto-rendered from episode YAML push." \
            --latest=false
          echo "has_release=true" >> "$GITHUB_OUTPUT"

      - name: Queue to Buffer (TikTok)
        if: steps.release.outputs.has_release == 'true'
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          if [ -z "$BUFFER_TOKEN" ]; then
            echo "BUFFER_TOKEN not set — skipping"
            exit 0
          fi
          tag="${{ steps.release.outputs.tag }}"
          # Post videos
          for mp4 in videos/*.mp4; do
            [ -f "$mp4" ] || continue
            echo "$mp4" | grep -q '\-silent\.mp4$' && continue
            name=$(basename "$mp4" .mp4)
            video_url="https://github.com/${{ github.repository }}/releases/download/${tag}/${name}.mp4"
            caption_file="videos/${name}-caption.txt"
            if [ -f "$caption_file" ]; then caption=$(cat "$caption_file"); else caption="$name"; fi
            echo "Queuing video $name to Buffer..."
            query=$(jq -n --arg text "$caption" --arg ch "$BUFFER_CHANNEL_ID" --arg url "$video_url" \
              '{query: "mutation CreatePost($input: CreatePostInput!) { createPost(input: $input) { ... on PostActionSuccess { post { id } } ... on MutationError { message } } }", variables: {input: {text: $text, channelId: $ch, schedulingType: "automatic", mode: "addToQueue", assets: [{video: {url: $url, metadata: {thumbnailOffset: 2000}}}]}}}')
            response=$(curl -sf -X POST "https://api.buffer.com" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $BUFFER_TOKEN" \
              -d "$query")
            echo "$response" | jq .
          done
          # Post carousels (multi-image) — slides are flat: videos/{name}-slide-{NN}.png
          for slides_dir in videos/*-slides; do
            [ -d "$slides_dir" ] || continue
            name=$(basename "$slides_dir" -slides)
            caption_file="videos/${name}-caption.txt"
            if [ -f "$caption_file" ]; then caption=$(cat "$caption_file"); else caption="$name"; fi
            # Build image asset array from flat release assets
            assets="[]"
            for slide in videos/${name}-slide-*.png; do
              slide_file=$(basename "$slide")
              slide_url="https://github.com/${{ github.repository }}/releases/download/${tag}/${slide_file}"
              assets=$(echo "$assets" | jq --arg url "$slide_url" '. + [{image: {url: $url}}]')
            done
            echo "Queuing carousel $name to Buffer ($(echo "$assets" | jq length) slides)..."
            query=$(jq -n --arg text "$caption" --arg ch "$BUFFER_CHANNEL_ID" --argjson assets "$assets" \
              '{query: "mutation CreatePost($input: CreatePostInput!) { createPost(input: $input) { ... on PostActionSuccess { post { id } } ... on MutationError { message } } }", variables: {input: {text: $text, channelId: $ch, schedulingType: "automatic", mode: "addToQueue", assets: $assets}}}')
            response=$(curl -sf -X POST "https://api.buffer.com" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $BUFFER_TOKEN" \
              -d "$query")
            echo "$response" | jq .
          done
